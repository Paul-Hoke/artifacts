<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"></meta>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
  <title>Artifacts MMO</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d0d;
      color: #e0c97f;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 3rem;
      color: #f0d060;
      text-shadow: 0 0 20px #f0a020;
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    .tagline {
      margin-top: 8px;
      font-size: 0.95rem;
      color: #a08040;
      letter-spacing: 2px;
    }

    .status-bar {
      display: flex;
      gap: 32px;
      background: #1a1a1a;
      border: 1px solid #3a3010;
      border-radius: 6px;
      padding: 16px 32px;
      margin-bottom: 48px;
    }

    .stat {
      text-align: center;
    }

    .stat-label {
      font-size: 0.7rem;
      color: #806030;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 1.4rem;
      color: #f0d060;
      margin-top: 4px;
    }

    .stat-value.online {
      color: #40c060;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #3a3010;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      border-color: #f0a020;
      box-shadow: 0 0 12px #f0a02033;
    }

    .card-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .card h2 {
      font-size: 1rem;
      color: #f0d060;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 0.8rem;
      color: #806030;
      line-height: 1.5;
    }

    footer {
      margin-top: 64px;
      font-size: 0.7rem;
      color: #503020;
      letter-spacing: 1px;
    }

    .char-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .map-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .map-label {
      font-size: 0.6rem;
      color: #a08040;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .map-grid {
      display: grid;
      border: 1px solid #3a3010;
      gap: 0;
    }

    .map-tile {
      width: 80px;
      height: 80px;
      position: relative;
      border: 0.5px solid rgba(0, 0, 0, 0.4);
      background-color: #111;
      overflow: hidden;
    }

    .map-tile img:not(.char-marker) {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .map-tile {
      cursor: pointer;
    }

    .char-marker {
      position: absolute;
      width: 39%;
      height: 39%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      object-fit: contain;
      image-rendering: pixelated;
      cursor: pointer;
    }

    #char-popover {
      display: none;
      position: fixed;
      z-index: 1000;
      background: #1a1a1a;
      border: 1px solid #f0a020;
      border-radius: 6px;
      padding: 14px 18px;
      box-shadow: 0 0 16px #f0a02044;
      pointer-events: none;
      min-width: 200px;
    }

    #char-popover .cp-name {
      font-size: 0.9rem;
      font-weight: bold;
      color: #f0d060;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    #char-popover .cp-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 0.7rem;
      color: #a08040;
      margin-bottom: 3px;
    }

    #char-popover .cp-row span:last-child {
      color: #e0c97f;
      text-align: right;
    }

    #char-popover .cp-divider {
      border: none;
      border-top: 1px solid #3a3010;
      margin: 8px 0;
    }

    #tile-popover {
      display: none;
      position: fixed;
      z-index: 1000;
      background: #1a1a1a;
      border: 1px solid #f0a020;
      border-radius: 6px;
      padding: 10px 14px;
      box-shadow: 0 0 16px #f0a02044;
      pointer-events: none;
    }

    #tile-popover .pop-name {
      font-size: 0.8rem;
      font-weight: bold;
      color: #f0d060;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .char-sprite-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 8px;
      border: 1px solid transparent;
      border-radius: 6px;
      transition: border-color 0.15s;
    }

    .char-sprite-item:hover {
      border-color: #3a3010;
    }

    .char-sprite-item.active {
      border-color: #f0a020;
      box-shadow: 0 0 8px #f0a02044;
    }

    .char-sprite-item img {
      width: 64px;
      height: 64px;
      image-rendering: pixelated;
      object-fit: contain;
    }

    .char-sprite-name {
      font-size: 0.65rem;
      color: #f0d060;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .map-tile.char-highlighted {
      outline: 3px solid #f0d060;
      outline-offset: -3px;
      z-index: 1;
    }

    #tile-popover .pop-coords {
      font-size: 0.7rem;
      color: #a08040;
    }

    #walk-toggle {
      font-family: 'Courier New', monospace;
      font-size: 0.65rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid #40c060;
      color: #40c060;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    #walk-toggle:hover {
      background: #40c06022;
    }

    #walk-toggle.walk-off {
      border-color: #c04040;
      color: #c04040;
    }

    #walk-toggle.walk-off:hover {
      background: #c0404022;
    }
  </style>
</head>
<body>

  <header>
    <h1>Artifacts</h1>
  </header>


  <section id="characters-section" style="margin-top: 16px; width: 100%; max-width: 1600px;">
    <div id="shared-map-section" style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 16px;">
        <span class="map-label" id="map-header-label">World Map</span>
        <button id="walk-toggle" title="Toggle auto random walk">Start Auto-Walk</button>
      </div>
    </div>
    <h2 style="text-align: center; font-size: 1rem; letter-spacing: 4px; text-transform: uppercase; color: #f0d060; margin-top: 32px; margin-bottom: 16px;">
      Your Characters
    </h2>
    <div id="characters-container" style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; align-items: flex-start;"></div>
    <p id="characters-error" style="display: none; text-align: center; color: #805030; font-size: 0.8rem; margin-top: 16px;"></p>
  </section>

  <div id="char-popover"></div>

  <div id="tile-popover">
    <div class="pop-name" id="pop-name"></div>
    <div class="pop-coords" id="pop-coords"></div>
    <div class="pop-coords" id="pop-mapid"></div>
  </div>

  <footer>
    &copy; 2026 Artifacts MMO &mdash; All rights reserved
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  <script>
    // ── Module-level state (for WebSocket updates) ───────────────────────────
    let cellsByPosition = {};  // "x,y" → cell element
    let charMarkers     = {};  // charName → marker img element
    let charCells       = {};  // charName → cell element (for highlight)
    let charDataMap     = {};  // charName → char data object
    let charAnimations  = {};  // charName → cancel function for in-flight animation

    // ── Constants ────────────────────────────────────────────────────────────
    const VIEW_R   = 4;   // tiles visible in each direction (9×9 view)

    // ── Shared map ───────────────────────────────────────────────────────────
    function makeTileCell(tile, characters) {
      const cell = document.createElement('div');
      cell.className = 'map-tile';

      if (tile) {
        cellsByPosition[tile.x + ',' + tile.y] = cell;
      }

      if (tile?.skin) {
        const img = document.createElement('img');
        img.src = '/' + tile.skin + '.png';
        img.alt = tile.skin;
        cell.appendChild(img);
      }

      if (tile) {
        characters.forEach(char => {
          if (char.x === tile.x && char.y === tile.y && char.skin) {
            const marker = document.createElement('img');
            marker.src = '/' + char.skin + '.png';
            marker.alt = char.skin;
            marker.className = 'char-marker';
            marker.dataset.charName = char.name;
            marker.addEventListener('click', e => {
              e.stopPropagation();
              showCharPopover(marker, charDataMap[char.name] ?? char);
            });
            charMarkers[char.name] = marker;
            cell.appendChild(marker);
          }
        });

        cell.addEventListener('click', e => {
          e.stopPropagation();
          const pop = document.getElementById('tile-popover');
          if (pop._activeTile === cell && pop.style.display === 'block') {
            pop.style.display = 'none';
            pop._activeTile = null;
            return;
          }
          pop._activeTile = cell;
          document.getElementById('pop-name').textContent = tile.name ?? tile.skin ?? '';
          document.getElementById('pop-coords').textContent = `(${tile.x}, ${tile.y})`;
          document.getElementById('pop-mapid').textContent = tile.map_id != null ? `map id: ${tile.map_id}` : '';
          pop.style.display = 'block';
          const rect = cell.getBoundingClientRect();
          const pw = pop.offsetWidth;
          const ph = pop.offsetHeight;
          let left = rect.left + rect.width / 2 - pw / 2;
          let top  = rect.top - ph - 8;
          if (top < 8) top = rect.bottom + 8;
          left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
          pop.style.left = left + 'px';
          pop.style.top  = top  + 'px';
        });
      }

      return cell;
    }

    function buildSharedMap(characters, tileMap) {
      const tilePositions = Object.keys(tileMap).map(k => k.split(',').map(Number));
      const allX = tilePositions.map(p => p[0]);
      const allY = tilePositions.map(p => p[1]);
      const minX = Math.min(...allX);
      const maxX = Math.max(...allX);
      const minY = Math.min(...allY);
      const maxY = Math.max(...allY);
      const cols = maxX - minX + 1;
      const rows = maxY - minY + 1;

      const grid = document.createElement('div');
      grid.className = 'map-grid';
      grid.style.gridTemplateColumns = `repeat(${cols}, 80px)`;
      grid.style.gridTemplateRows    = `repeat(${rows}, 80px)`;

      for (let ty = minY; ty <= maxY; ty++) {
        for (let tx = minX; tx <= maxX; tx++) {
          const cell = makeTileCell(tileMap[tx + ',' + ty], characters);
          characters.forEach(char => {
            if (char.x === tx && char.y === ty) charCells[char.name] = cell;
          });
          grid.appendChild(cell);
        }
      }

      document.getElementById('shared-map-section').appendChild(grid);
    }

    // ── Character popover HTML ───────────────────────────────────────────────
    function charPopoverHTML(char) {
      function row(emoji, label, value) {
        return `<div class="cp-row"><span>${emoji} ${label}</span><span>${value}</span></div>`;
      }
      return `
        <div class="cp-name">${char.name}</div>
        ${row('⭐', 'Level',          char.level)}
        ${row('❤️', 'HP',             `${char.hp} / ${char.max_hp}`)}
        ${row('✨', 'XP',             `${char.xp} / ${char.max_xp}`)}
        ${row('💰', 'Gold',           char.gold ?? 0)}
        ${row('📍', 'Position',       `(${char.x}, ${char.y})`)}
        <hr class="cp-divider"/>
        ${row('⛏️',  'Mining',         char.mining_level ?? 1)}
        ${row('🪓',  'Woodcutting',    char.woodcutting_level ?? 1)}
        ${row('🎣',  'Fishing',        char.fishing_level ?? 1)}
        ${row('🍳',  'Cooking',        char.cooking_level ?? 1)}
        ${row('⚔️',  'Weaponcrafting', char.weaponcrafting_level ?? 1)}
        ${row('🛡️',  'Gearcrafting',   char.gearcrafting_level ?? 1)}
        ${row('💎',  'Jewelrycrafting',char.jewelrycrafting_level ?? 1)}
        ${row('⚗️',  'Alchemy',        char.alchemy_level ?? 1)}
      `;
    }

    function showCharPopover(anchor, char) {
      const pop = document.getElementById('char-popover');
      if (pop._activeCanvas === anchor && pop.style.display === 'block') {
        pop.style.display = 'none';
        pop._activeCanvas = null;
        return;
      }
      pop._activeCanvas = anchor;
      pop.innerHTML = charPopoverHTML(char);
      pop.style.display = 'block';
      const rect = anchor.getBoundingClientRect();
      const pw = pop.offsetWidth;
      const ph = pop.offsetHeight;
      let left = rect.right + 12;
      let top  = rect.top;
      if (left + pw > window.innerWidth - 8) left = rect.left - pw - 12;
      top = Math.max(8, Math.min(top, window.innerHeight - ph - 8));
      pop.style.left = left + 'px';
      pop.style.top  = top  + 'px';
    }

    // ── Render one character sprite + name ──────────────────────────────────
    function renderCharacter(char) {
      const item = document.createElement('div');
      item.className = 'char-sprite-item';

      const img = document.createElement('img');
      img.src = '/' + char.skin + '.png';
      img.alt = char.name;
      item.appendChild(img);

      const name = document.createElement('div');
      name.className = 'char-sprite-name';
      name.textContent = char.name;
      item.appendChild(name);

      item.addEventListener('click', e => {
        e.stopPropagation();
        // Deactivate all other sprite items and clear map highlights
        document.querySelectorAll('.char-sprite-item').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.map-tile').forEach(el => el.classList.remove('char-highlighted'));
        // Activate this one and highlight on map
        item.classList.add('active');
        if (charCells[char.name]) charCells[char.name].classList.add('char-highlighted');
      });

      document.getElementById('characters-container').appendChild(item);
    }

    // ── Data loading ─────────────────────────────────────────────────────────

    // Fetches all overworld map tiles across all pages.
    async function loadOverworldTiles() {
      const firstRes = await fetch('/maps?size=500&page=1');
      const firstJson = await firstRes.json();
      const totalPages = firstJson.pages ?? 1;

      const pagePromises = [];
      for (let p = 2; p <= totalPages; p++) {
        pagePromises.push(fetch('/maps?size=500&page=' + p).then(r => r.json()));
      }
      const restJsons = await Promise.all(pagePromises);

      const tileMap = {};
      const allData = [
        ...(firstJson.data ?? []),
        ...restJsons.flatMap(j => j.data ?? []),
      ];
      allData.forEach(tile => {
        if (tile.layer === 'overworld') {
          tileMap[tile.x + ',' + tile.y] = tile;
        }
      });

      return tileMap;
    }

    // ── Character movement animation ─────────────────────────────────────────
    const TILE_PX    = 80;
    const MARKER_PCT = 0.39;
    const MARKER_PX  = TILE_PX * MARKER_PCT;

    function animateCharacterMove(name, fromCell, toCell, durationMs) {
      const marker = charMarkers[name];
      if (!marker) return;

      // Cancel any in-flight animation for this character
      if (charAnimations[name]) {
        charAnimations[name]();
        delete charAnimations[name];
      }

      // Detach from current parent
      if (marker.parentElement) marker.parentElement.removeChild(marker);

      // Destination off-map: leave marker hidden
      if (!toCell) return;

      // No source cell or negligible duration: snap immediately
      if (!fromCell || durationMs < 50) {
        toCell.appendChild(marker);
        return;
      }

      const fromRect = fromCell.getBoundingClientRect();
      const toRect   = toCell.getBoundingClientRect();
      const startX   = fromRect.left + window.scrollX + (TILE_PX - MARKER_PX) / 2;
      const startY   = fromRect.top  + window.scrollY + (TILE_PX - MARKER_PX) / 2;
      const endX     = toRect.left   + window.scrollX + (TILE_PX - MARKER_PX) / 2;
      const endY     = toRect.top    + window.scrollY + (TILE_PX - MARKER_PX) / 2;

      // Fly as an absolute-position overlay so it escapes cell overflow:hidden
      // and scrolls with the page (unlike fixed)
      marker.style.cssText = [
        'position:absolute',
        `width:${MARKER_PX}px`,
        `height:${MARKER_PX}px`,
        `left:${startX}px`,
        `top:${startY}px`,
        'z-index:500',
        'image-rendering:pixelated',
        'object-fit:contain',
        'cursor:pointer',
        `transition:left ${durationMs}ms linear,top ${durationMs}ms linear`,
      ].join(';');
      document.body.appendChild(marker);

      let settled = false;

      function settle() {
        if (settled) return;
        settled = true;
        delete charAnimations[name];
        if (marker.parentElement) marker.parentElement.removeChild(marker);
        marker.removeAttribute('style');
        toCell.appendChild(marker);
      }

      function cancel() {
        if (settled) return;
        settled = true;
        if (marker.parentElement) marker.parentElement.removeChild(marker);
        marker.removeAttribute('style');
      }

      charAnimations[name] = cancel;

      // Force reflow, then start transition
      marker.getBoundingClientRect();
      marker.style.left = endX + 'px';
      marker.style.top  = endY + 'px';

      marker.addEventListener('transitionend', settle, { once: true });
      setTimeout(settle, durationMs + 200); // safety net if transitionend misfires
    }

    // ── WebSocket position update ─────────────────────────────────────────────
    function updateCharacterPosition(update) {
      const marker = charMarkers[update.name];
      if (!marker) return;

      const fromCell   = charCells[update.name] ?? null;
      const newCell    = cellsByPosition[update.x + ',' + update.y] ?? null;
      const durationMs = Math.round((update.cooldownSeconds ?? 0) * 1000);

      // Update tracking state immediately
      charCells[update.name] = newCell;

      const charData = charDataMap[update.name];
      if (charData) {
        charData.x = update.x;
        charData.y = update.y;
        charData.skin = update.skin;
      }

      animateCharacterMove(update.name, fromCell, newCell, durationMs);

      // Move map highlight to destination
      const activeItem = document.querySelector('.char-sprite-item.active');
      if (activeItem) {
        const nameEl = activeItem.querySelector('.char-sprite-name');
        if (nameEl && nameEl.textContent === update.name) {
          document.querySelectorAll('.map-tile').forEach(el => el.classList.remove('char-highlighted'));
          if (newCell) newCell.classList.add('char-highlighted');
        }
      }
    }

    // ── Auto-walk toggle ─────────────────────────────────────────────────────
    let walkerEnabled = true; // matches server default

    function applyWalkToggleState(enabled) {
      walkerEnabled = enabled;
      const btn = document.getElementById('walk-toggle');
      if (!btn) return;
      if (enabled) {
        btn.textContent = 'Stop Auto-Walk';
        btn.classList.remove('walk-off');
      } else {
        btn.textContent = 'Start Auto-Walk';
        btn.classList.add('walk-off');
      }
    }

    function initWalkToggle() {
      fetch('/api/random-walk/state')
        .then(r => r.json())
        .then(data => applyWalkToggleState(data.enabled))
        .catch(() => {});

      document.getElementById('walk-toggle').addEventListener('click', () => {
        const endpoint = walkerEnabled ? '/api/random-walk/stop' : '/api/random-walk/start';
        fetch(endpoint, { method: 'POST' }).catch(() => {});
        // State will update via WebSocket broadcast
      });
    }

    function connectWebSocket() {
      const socket = new SockJS('/ws');
      const stompClient = Stomp.over(socket);
      stompClient.debug = null; // suppress console noise
      stompClient.connect({}, () => {
        stompClient.subscribe('/topic/characters', msg => {
          const update = JSON.parse(msg.body);
          updateCharacterPosition(update);
        });
        stompClient.subscribe('/topic/walker-state', msg => {
          const state = JSON.parse(msg.body);
          applyWalkToggleState(state.enabled);
        });
      });
    }

    async function init() {
      try {
        const charsRes = await fetch('/my/characters').then(r => r.json());
        const characters = charsRes.data ?? [];

        if (characters.length === 0) {
          document.getElementById('characters-error').style.display = 'block';
          document.getElementById('characters-error').textContent = 'No characters found.';
          return;
        }

        const tileMap = await loadOverworldTiles();

        // Reset module-level state
        cellsByPosition = {};
        charMarkers     = {};
        charCells       = {};
        charDataMap     = {};
        charAnimations  = {};
        characters.forEach(char => { charDataMap[char.name] = char; });

        buildSharedMap(characters, tileMap);
        characters.forEach(char => renderCharacter(char));

        connectWebSocket();
        initWalkToggle();
      } catch (e) {
        document.getElementById('characters-error').style.display = 'block';
        document.getElementById('characters-error').textContent = 'Could not load data: ' + e.message;
      }
    }

    document.addEventListener('click', () => {
      const tp = document.getElementById('tile-popover');
      tp.style.display = 'none';
      tp._activeTile = null;
      const cp = document.getElementById('char-popover');
      cp.style.display = 'none';
      cp._activeCanvas = null;
    });

    init();
  </script>

</body>
</html>
